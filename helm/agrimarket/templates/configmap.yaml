apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agrimarket.fullname" . }}-config
  labels:
    {{- include "agrimarket.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.config.springProfilesActive | quote }}
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
