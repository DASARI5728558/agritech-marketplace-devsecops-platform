<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — AgriTech Marketplace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="cart">
  <header class="topbar">
    <a class="brand" href="../index.html">
      <span class="brand-mark"><i class="fa-solid fa-seedling"></i></span>
      <span>
        <strong>AgriTech Marketplace</strong>
        <small>AI crop-input recommendations</small>
      </span>
    </a>
    <nav class="nav">
      <a href="../index.html"><i class="fa-solid fa-house"></i> Home</a>
      <a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
      <a href="register.html"><i class="fa-solid fa-user-plus"></i> Register</a>
      <a href="cart.html" class="cart-link active">
        <i class="fa-solid fa-basket-shopping"></i> Cart
        <span id="cartCount">0</span>
      </a>
    </nav>
  </header>

  <main class="cart-page">
    <h1><i class="fa-solid fa-basket-shopping"></i> Your cart</h1>

    <div class="form-msg success" id="checkoutMsg">
      <i class="fa-solid fa-circle-check"></i> Order placed! This is a demo checkout — no payment was taken.
    </div>

    <div class="cart-layout" id="cartLayout">
      <div class="cart-items" id="cartItems"></div>

      <aside class="cart-summary">
        <h3>Order summary</h3>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="cartSubtotal">₹0</span>
        </div>
        <div class="summary-row">
          <span>Delivery</span>
          <span id="cartDelivery">₹0</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="cartTotal">₹0</span>
        </div>
        <button class="btn btn-primary btn-block" id="checkoutBtn" style="margin-top: 16px;">
          <i class="fa-solid fa-lock"></i> Checkout
        </button>
      </aside>
    </div>

    <div class="cart-empty hidden" id="cartEmpty">
      <i class="fa-solid fa-basket-shopping"></i>
      <p>Your cart is empty. <a class="link-muted" href="../index.html">Browse the catalog</a> to add products.</p>
    </div>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
