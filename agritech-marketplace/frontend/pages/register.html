<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — AgriTech Marketplace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="register">
  <header class="topbar">
    <a class="brand" href="../index.html">
      <span class="brand-mark"><i class="fa-solid fa-seedling"></i></span>
      <span>
        <strong>AgriTech Marketplace</strong>
        <small>AI crop-input recommendations</small>
      </span>
    </a>
    <nav class="nav">
      <a href="../index.html"><i class="fa-solid fa-house"></i> Home</a>
      <a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
      <a href="register.html" class="active"><i class="fa-solid fa-user-plus"></i> Register</a>
      <a href="cart.html" class="cart-link">
        <i class="fa-solid fa-basket-shopping"></i> Cart
        <span id="cartCount">0</span>
      </a>
    </nav>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <span class="auth-icon"><i class="fa-solid fa-user-plus"></i></span>
      <h1>Create your account</h1>
      <p class="sub">Join as a farmer to list produce, or as a buyer to order it.</p>

      <div class="form-msg" id="registerMsg"></div>

      <form id="registerForm" novalidate>
        <div class="role-toggle">
          <label>
            <input type="radio" name="role" value="farmer" checked />
            <span><i class="fa-solid fa-tractor"></i> Farmer</span>
          </label>
          <label>
            <input type="radio" name="role" value="buyer" />
            <span><i class="fa-solid fa-basket-shopping"></i> Buyer</span>
          </label>
        </div>

        <div class="field">
          <label for="regName">Full name</label>
          <div class="input-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="regName" name="name" placeholder="Jane Doe" required />
          </div>
        </div>

        <div class="field">
          <label for="regEmail">Email address</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="regEmail" name="email" placeholder="you@example.com" required />
          </div>
        </div>

        <div class="field">
          <label for="regPhone">Phone number</label>
          <div class="input-wrap">
            <i class="fa-solid fa-phone"></i>
            <input type="tel" id="regPhone" name="phone" placeholder="+91 98765 43210" />
          </div>
        </div>

        <div class="field">
          <label for="regPassword">Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="regPassword" name="password" placeholder="••••••••" required />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          <i class="fa-solid fa-user-plus"></i> Create account
        </button>
      </form>

      <p class="auth-foot">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
