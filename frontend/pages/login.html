<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AgriTech Marketplace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="login">
  <header class="topbar">
    <a class="brand" href="../index.html">
      <span class="brand-mark"><i class="fa-solid fa-seedling"></i></span>
      <span>
        <strong>AgriTech Marketplace</strong>
        <small>AI crop-input recommendations</small>
      </span>
    </a>
    <nav class="nav">
      <a href="../index.html"><i class="fa-solid fa-house"></i> Home</a>
      <a href="login.html" class="active"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
      <a href="register.html"><i class="fa-solid fa-user-plus"></i> Register</a>
      <a href="cart.html" class="cart-link">
        <i class="fa-solid fa-basket-shopping"></i> Cart
        <span id="cartCount">0</span>
      </a>
    </nav>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <span class="auth-icon"><i class="fa-solid fa-right-to-bracket"></i></span>
      <h1>Welcome back</h1>
      <p class="sub">Log in to manage your orders and produce listings.</p>

      <div class="form-msg" id="loginMsg"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginEmail">Email address</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="loginEmail" name="email" placeholder="you@example.com" required />
          </div>
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="loginPassword" name="password" placeholder="••••••••" required />
          </div>
        </div>

        <div class="field-row">
          <label class="checkbox-line">
            <input type="checkbox" name="remember" /> Remember me
          </label>
          <a class="link-muted" href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          <i class="fa-solid fa-right-to-bracket"></i> Log in
        </button>
      </form>

      <p class="auth-foot">
        Don't have an account? <a href="register.html">Create one</a>
      </p>
    </div>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
